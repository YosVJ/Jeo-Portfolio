name: Apply portfolio content refresh

on:
  push:
    branches:
      - enhance-automation-portfolio
    paths:
      - '.portfolio/portfolio-update.patch.gz.b64'
      - '.github/workflows/apply-portfolio-content-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: enhance-automation-portfolio
          fetch-depth: 0

      - name: Decode and apply reviewed content patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .portfolio/portfolio-update.patch.gz.b64 | gzip --decompress > /tmp/portfolio-update.patch
          git apply --check /tmp/portfolio-update.patch
          git apply /tmp/portfolio-update.patch
          rm -f .portfolio/portfolio-update.patch.gz.b64
          rm -f .github/workflows/apply-portfolio-content-refresh.yml
          rmdir .portfolio 2>/dev/null || true

      - name: Validate refreshed HTML
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI &amp; Programming Specialist' index.html
          grep -q 'id="experience"' index.html
          grep -q 'Spark Team Operations Tracker' index.html
          grep -q 'Spark Space' index.html
          grep -q 'id="clockWidget"' index.html
          grep -q 'id="dayNightToggle"' index.html
          grep -q 'id="mobileSidebar"' index.html
          grep -q 'id="bg-canvas"' index.html
          ! grep -q 'github.com/Spark-Logistics-LLC' index.html
          ! grep -q 'spark-team-ops-tracker.onrender.com' index.html

      - name: Commit refreshed portfolio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jeo Portfolio Automation'
          git config user.email 'jelonelvitao@gmail.com'
          git add -A
          git commit -m 'Apply AI and Programming Specialist content refresh'
          git push origin HEAD:enhance-automation-portfolio
